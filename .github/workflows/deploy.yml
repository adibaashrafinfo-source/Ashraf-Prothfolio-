name: Deploy to cPanel (ashrafarif.com)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Assemble deploy bundle (frontend + backend)
        run: |
          mkdir -p deploy_stage
          cp -r dist/. deploy_stage/
          mkdir -p deploy_stage/api
          cp -r server-php/. deploy_stage/api/

      - name: Deploy to cPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          server: ${{ secrets.CPANEL_SSH_HOST }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          ssh_private_key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          local_path: './deploy_stage/*'
          remote_path: '/home/ashrafarif/public_html'
          sftpArgs: '-o ConnectTimeout=20'
