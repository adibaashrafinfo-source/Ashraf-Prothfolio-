name: Deploy to cPanel (ashrafarif.com)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to cPanel via rsync (SSH)
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          REMOTE_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
          SOURCE: 'dist/'
          TARGET: '/home/ashrafarif/public_html/'
          ARGS: '-avzr --delete --exclude=".git/" --exclude=".github/" --exclude="api/"'
